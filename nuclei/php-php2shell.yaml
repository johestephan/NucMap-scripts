id: php-php2shell

info:
  name: PHP PHP2Shell Remote Code Execution Detection (CVE-2026-109618, CVE-2026-109619)
  author: johestephan
  severity: critical
  description: |
    Detects PHP services running versions vulnerable to PHP2Shell (CVE-2026-109618 and CVE-2026-109619).
    * CVE-2026-109618: Out-of-memory (OOM) error handling via longjmp() leaves request memory uninitialized,
      allowing attackers to reliably achieve RCE using OOM triggers.
    * CVE-2026-109619: Fatal error handling via longjmp() leaves global memory pointing to freed memory
      regions (Use-After-Free) across subsequent requests on the same worker process.

    Affected PHP versions: 5.4 through 8.5 prior to 8.2.35, 8.3.36, 8.4.27, and 8.5.12.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109618
    - https://nvd.nist.gov/vuln/detail/CVE-2026-109619
    - https://security.paloaltonetworks.com/CVE-2026-109618
    - https://security.paloaltonetworks.com/CVE-2026-109619
    - https://unit42.paloaltonetworks.com/threat-brief-php-cve-2026-109618-cve-2026-109619/
  classification:
    cve-id: CVE-2026-109618,CVE-2026-109619
    cwe-id: CWE-754,CWE-416
    cvss-score: 9.2
  tags: php,rce,php2shell,cve,cve2026,critical,nucmap

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/info.php"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          # PHP 5.4.x - 5.6.x, 7.x, 8.0.x, 8.1.x (all EOL upstream and affected)
          - '(?i)PHP/(5\.[4-6]\.[0-9]+|7\.[0-4]\.[0-9]+|8\.[01]\.[0-9]+)'
          # PHP 8.2.0 - 8.2.34 (Fixed in 8.2.35)
          - '(?i)PHP/8\.2\.([0-9]|[12][0-9]|3[0-4])([^0-9]|$)'
          # PHP 8.3.0 - 8.3.35 (Fixed in 8.3.36)
          - '(?i)PHP/8\.3\.([0-9]|[12][0-9]|3[0-5])([^0-9]|$)'
          # PHP 8.4.0 - 8.4.26 (Fixed in 8.4.27)
          - '(?i)PHP/8\.4\.([0-9]|1[0-9]|2[0-6])([^0-9]|$)'
          # PHP 8.5.0 - 8.5.11 (Fixed in 8.5.12)
          - '(?i)PHP/8\.5\.([0-9]|1[01])([^0-9]|$)'

      - type: regex
        part: body
        regex:
          - 'PHP Version</td><td[^>]*>(5\.[4-6]\.[0-9]+|7\.[0-4]\.[0-9]+|8\.[01]\.[0-9]+)'
          - 'PHP Version</td><td[^>]*>(8\.2\.([0-9]|[12][0-9]|3[0-4]))([^0-9]|<)'
          - 'PHP Version</td><td[^>]*>(8\.3\.([0-9]|[12][0-9]|3[0-5]))([^0-9]|<)'
          - 'PHP Version</td><td[^>]*>(8\.4\.([0-9]|1[0-9]|2[0-6]))([^0-9]|<)'
          - 'PHP Version</td><td[^>]*>(8\.5\.([0-9]|1[01]))([^0-9]|<)'

    extractors:
      - type: regex
        part: header
        name: php_header_version
        group: 1
        regex:
          - '(?i)PHP/([0-9]+\.[0-9]+\.[0-9]+)'

      - type: regex
        part: body
        name: phpinfo_version
        group: 1
        regex:
          - 'PHP Version</td><td[^>]*>([0-9]+\.[0-9]+\.[0-9]+)'
